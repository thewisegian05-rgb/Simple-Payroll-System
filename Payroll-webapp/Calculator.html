<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Premium Payroll System — Dashboard</title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="calculator.css"
    >

</head>


<body>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav id="site-nav">

        <a
            href="index.html"
            class="logo"
        >

            <div class="logo-icon"></div>

            Payroll

        </a>


        <div class="nav-actions">

            <!-- Compact search — hidden until nav is scrolled, mirrors #search-employee -->

            <div class="nav-search">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="14"
                    height="14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                >

                    <circle
                        cx="11"
                        cy="11"
                        r="8"
                    ></circle>

                    <line
                        x1="21"
                        y1="21"
                        x2="16.65"
                        y2="16.65"
                    ></line>

                </svg>

                <input
                    type="text"
                    id="nav-search-employee"
                    placeholder="Search employee..."
                >

            </div>


            <!-- Hidden Excel file input -->

            <input
                type="file"
                id="excel-file"
                accept=".xlsx,.xls"
                style="display: none;"
            >


            <!-- Calculator button -->

            <button
                class="btn"
                id="open-calculator-btn"
                type="button"
            >
                Calculator
            </button>


            <!-- Upload Excel button -->

            <button
                class="btn"
                id="upload-excel-btn"
                type="button"
            >
                Upload Excel
            </button>


            <!-- Export CSV -->

            <button
                class="btn btn-solid btn-export"
                id="export-csv-btn"
                type="button"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                >

                    <path
                        d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
                    ></path>

                    <polyline
                        points="7 10 12 15 17 10"
                    ></polyline>

                    <line
                        x1="12"
                        y1="15"
                        x2="12"
                        y2="3"
                    ></line>

                </svg>

                Export CSV

            </button>

        </div>

    </nav>



    <!-- =====================================================
         MAIN DASHBOARD
    ====================================================== -->

    <main class="dashboard-main">

        <div class="dashboard-container">


            <!-- =================================================
                 HEADER
            ================================================== -->

            <div class="dashboard-header">

                <div>

                    <h1>
                        Exercise 01: Find Gross Pay
                    </h1>

                    <p>
                        Review employee payroll details and gross pay calculations.
                    </p>

                </div>


                <div class="header-actions">


                    <!-- Search -->

                    <div class="search-box">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            viewBox="0 0 24 24"
                        >

                            <circle
                                cx="11"
                                cy="11"
                                r="8"
                            ></circle>

                            <line
                                x1="21"
                                y1="21"
                                x2="16.65"
                                y2="16.65"
                            ></line>

                        </svg>


                        <input
                            type="text"
                            id="search-employee"
                            placeholder="Search employee..."
                        >

                    </div>

                </div>

            </div>



            <!-- =================================================
                 PAYROLL TABLE
            ================================================== -->

            <div class="table-wrapper">

                <table class="payroll-table">

                    <thead>

                        <tr>

                            <th>Date of Payment</th>

                            <th>Employee</th>

                            <th>State</th>

                            <th>Regular</th>

                            <th>Paid Time Off</th>

                            <th>Overtime</th>

                            <th>Nontaxable Income</th>

                            <th>Gross Pay</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <!-- Firestore records appear here -->

                    <tbody id="payroll-table-body">

                    </tbody>

                </table>

            </div>



            <!-- =================================================
                 PAGINATION
                 (buttons are generated dynamically by payroll.js
                 based on how many records exist)
            ================================================== -->

            <div class="pagination">

            </div>

        </div>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <div class="footer-links">

            <a href="#">
                Gian Almonte
            </a>

            <a href="#">
                Paul Quintero
            </a>

        </div>

        <p>
            &copy; Simple Payroll System.
        </p>

    </footer>



    <!-- =====================================================
         CALCULATOR MODAL
    ====================================================== -->

    <div class="modal-overlay" id="calculator-modal-overlay">

        <div class="modal">

            <div class="modal-header">

                <h2>Payroll Calculator</h2>

                <button
                    class="modal-close"
                    id="calculator-modal-close"
                    type="button"
                >
                    &times;
                </button>

            </div>


            <div class="modal-body">

                <div class="calc-type-group">

                    <label class="modal-label" for="calc-type-select">
                        What do you want to calculate?
                    </label>

                    <select id="calc-type-select" class="calc-select">
                        <option value="gross">Gross Pay</option>
                        <option value="tax">Tax</option>
                        <option value="net">Net Pay</option>
                        <option value="hours">Hours</option>
                        <option value="monthly">Monthly</option>
                    </select>

                </div>


                <!-- GROSS PAY -->
                <div class="calc-section" data-calc-type="gross">

                    <div class="calc-field">
                        <label>Regular ($)</label>
                        <input type="number" id="g-regular" step="0.01" placeholder="0.00">
                    </div>

                    <div class="calc-field">
                        <label>Paid Time Off ($)</label>
                        <input type="number" id="g-pto" step="0.01" placeholder="0.00">
                    </div>

                    <div class="calc-field">
                        <label>Overtime ($)</label>
                        <input type="number" id="g-overtime" step="0.01" placeholder="0.00">
                    </div>

                    <div class="calc-field">
                        <label>Nontaxable Income ($)</label>
                        <input type="number" id="g-nontaxable" step="0.01" placeholder="0.00">
                    </div>

                    <div id="g-error"></div>
                    <div id="g-result"></div>

                </div>


                <!-- TAX -->
                <div class="calc-section" data-calc-type="tax" style="display:none;">

                    <div class="calc-field">
                        <label>Gross Pay ($)</label>
                        <input type="number" id="t-gross" step="0.01" placeholder="0.00">
                    </div>

                    <div class="calc-field">
                        <label>State Tax Rate (e.g. 0.05 for 5%)</label>
                        <input type="number" id="t-state" step="0.001" placeholder="0.00">
                    </div>

                    <div id="t-error"></div>
                    <div id="t-result"></div>

                </div>


                <!-- NET PAY -->
                <div class="calc-section" data-calc-type="net" style="display:none;">

                    <div class="calc-field">
                        <label>Gross Pay ($)</label>
                        <input type="number" id="n-gross" step="0.01" placeholder="0.00">
                    </div>

                    <div class="calc-field">
                        <label>State Tax Rate (e.g. 0.05 for 5%)</label>
                        <input type="number" id="n-state" step="0.001" placeholder="0.00">
                    </div>

                    <div id="n-error"></div>
                    <div id="n-result"></div>

                </div>


                <!-- HOURS -->
                <div class="calc-section" data-calc-type="hours" style="display:none;">

                    <div class="calc-field">
                        <label>Enter Time</label>
                        <input type="time" id="h-enter">
                    </div>

                    <div class="calc-field">
                        <label>Exit Time</label>
                        <input type="time" id="h-exit">
                    </div>

                    <div id="h-error"></div>
                    <div id="h-result"></div>

                </div>


                <!-- MONTHLY -->
                <div class="calc-section" data-calc-type="monthly" style="display:none;">

                    <div class="calc-field">
                        <label>Pay Amount per Period ($)</label>
                        <input type="number" id="m-amount" step="0.01" placeholder="0.00">
                    </div>

                    <div class="calc-field">
                        <label>Pay Frequency</label>
                        <select id="m-frequency">
                            <option value="weekly">Weekly</option>
                            <option value="biweekly">Biweekly</option>
                            <option value="semimonthly">Semimonthly</option>
                            <option value="monthly">Monthly</option>
                        </select>
                    </div>

                    <div id="m-error"></div>
                    <div id="m-result"></div>

                </div>


                <button class="btn btn-solid" id="calc-run-btn" type="button">
                    Calculate
                </button>

            </div>

        </div>

    </div>



    <!-- =====================================================
         XLSX LIBRARY
         MUST LOAD BEFORE EXCEL.JS
    ====================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
    ></script>



    <!-- =====================================================
         FIREBASE
    ====================================================== -->

    <script
        type="module"
        src="./firebase/firebase.js"
    ></script>



    <!-- =====================================================
         PAYROLL FIRESTORE LOGIC
    ====================================================== -->

    <script
        type="module"
        src="./js/payroll.js"
    ></script>



    <!-- =====================================================
         EXCEL IMPORT
    ====================================================== -->

    <script
        type="module"
        src="./js/excel.js"
    ></script>



    <!-- =====================================================
         EXISTING APPLICATION LOGIC
         (defines showError, clearBox, timeToDecimal — must
         load before the individual calculator scripts below)
    ====================================================== -->

    <script
        src="./js/app.js"
    ></script>



    <!-- =====================================================
         CALCULATOR LOGIC
    ====================================================== -->

    <script
        src="./js/attendance.js"
    ></script>

    <script
        src="./js/tax.js"
    ></script>

    <script
        src="./js/gross.js"
    ></script>

    <script
        src="./js/netpay.js"
    ></script>

    <script
        src="./js/monthly.js"
    ></script>



    <!-- =====================================================
         CALCULATOR MODAL CONTROLLER
    ====================================================== -->

    <script
        src="./js/calculator-ui.js"
    ></script>



    <!-- =====================================================
         STICKY NAV ON SCROLL
    ====================================================== -->

    <script
        src="./js/nav-scroll.js"
    ></script>


</body>

</html>
